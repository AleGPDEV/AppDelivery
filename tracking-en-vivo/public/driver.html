<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Compartir ubicación - Delivery</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Compartir mi ubicación</h1>
    <p class="subtitle">Dejá esta página abierta mientras hacés el reparto. Tu ubicación se actualiza sola en el panel.</p>
  </header>

  <main>
    <section class="panel">
      <div class="field">
        <label for="driver-name">Tu nombre</label>
        <input type="text" id="driver-name" placeholder="Ej: Juan">
      </div>

      <button id="toggle-btn" type="button" class="primary">Empezar a compartir ubicación</button>
      <p id="status" class="status"></p>
    </section>

    <section id="orders-section" class="panel" hidden>
      <h2>Tus pedidos</h2>
      <p id="route-summary" class="driver-count"></p>
      <a id="maps-link" href="#" target="_blank" rel="noopener" class="primary maps-button" hidden>Abrir ruta en Google Maps</a>
      <ul id="orders-list" class="order-list"></ul>
    </section>
  </main>

  <script src="/socket.io/socket.io.js"></script>
  <script src="geo.js?v=4"></script>
  <script src="driver.js?v=3"></script>
</body>
</html>
