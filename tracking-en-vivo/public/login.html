<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Iniciar sesión</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<script src="theme.js"></script>
<script src="branding.js"></script>
</head>
<body class="role-admin">
  <header>
    <button id="theme-toggle-btn" class="tab-btn" type="button"></button>
    <h1>Deliverys en vivo</h1>
    <p class="subtitle">Iniciá sesión para administrar pedidos y deliverys.</p>
  </header>

  <main>
    <section class="panel">
      <div class="field">
        <label for="login-user">Usuario</label>
        <input type="text" id="login-user" autocomplete="username">
      </div>
      <div class="field">
        <label for="login-pass">Contraseña</label>
        <input type="password" id="login-pass" autocomplete="current-password">
      </div>
      <button id="login-btn" type="button" class="primary">Entrar</button>
      <p id="login-status" class="status"></p>
    </section>
  </main>

  <script src="login.js"></script>
</body>
</html>
