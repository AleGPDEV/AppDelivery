<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Registro de pedidos</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="wide">
    <h1>Deliverys en vivo</h1>
    <p class="subtitle">Cargá pedidos, asignalos, y mirá cómo se mueven tus deliverys en el mapa.</p>
  </header>

  <nav class="tabs">
    <a href="nuevo-pedido.html" class="tab-btn">Nuevo pedido</a>
    <a href="pedidos.html" class="tab-btn active">Pedidos</a>
    <a href="dashboard.html" class="tab-btn">Deliverys y mapa</a>
    <a href="caja.html" class="tab-btn">Rendición de caja</a>
    <button id="logout-btn" class="tab-btn" type="button">Cerrar sesión</button>
  </nav>

  <main class="wide">
    <section class="panel">
      <h2>Registro de pedidos</h2>
      <p id="order-count" class="driver-count">Todavía no cargaste ningún pedido.</p>
      <div class="table-scroll">
        <table class="order-table">
          <thead>
            <tr id="order-thead-row"></tr>
          </thead>
          <tbody id="order-tbody"></tbody>
        </table>
      </div>
    </section>
  </main>

  <script src="/socket.io/socket.io.js"></script>
  <script src="geo.js?v=4"></script>
  <script src="pedidos.js"></script>
  <script src="logout.js"></script>
</body>
</html>
