<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Proveedores</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<script src="theme.js"></script>
</head>
<body class="role-admin">
  <header class="wide">
    <h1>Deliverys en vivo</h1>
    <p class="subtitle">Registrá los pagos a proveedores que salen de la caja del negocio.</p>
  </header>

  <nav class="tabs">
    <a href="nuevo-pedido.html" class="tab-btn">Nuevo pedido</a>
    <a href="pedidos.html" class="tab-btn">Pedidos</a>
    <a href="dashboard.html" class="tab-btn">Deliverys y mapa</a>
    <a href="caja.html" class="tab-btn">Rendición de caja</a>
    <a href="analiticas.html" class="tab-btn">Analíticas</a>
    <a href="catalogo.html" class="tab-btn">Catálogo</a>
    <a href="proveedores.html" class="tab-btn active">Proveedores</a>
    <button id="theme-toggle-btn" class="tab-btn" type="button"></button>
    <button id="logout-btn" class="tab-btn" type="button">Cerrar sesión</button>
  </nav>

  <main class="wide">
    <section class="panel">
      <h2>Nuevo gasto</h2>
      <p id="day-gate-msg" class="status error" style="display:none;">Iniciá el día desde "Analíticas" antes de cargar gastos.</p>
      <div class="field">
        <label for="expense-description">Descripción (a quién le pagaste)</label>
        <input type="text" id="expense-description" placeholder="Ej: Pescadería López">
      </div>
      <div class="field">
        <label for="expense-amount">Monto</label>
        <input type="text" id="expense-amount" placeholder="$ 3.500,00">
      </div>
      <div class="field">
        <label for="expense-payment-method">Método de pago</label>
        <select id="expense-payment-method"></select>
      </div>
      <button id="add-expense-btn" type="button" class="primary">Agregar gasto</button>
      <p id="add-expense-status" class="status"></p>
    </section>

    <section class="panel">
      <h2>Gastos de hoy</h2>
      <p id="expense-totals" class="hint"></p>
      <div class="table-scroll">
        <table class="order-table">
          <thead>
            <tr><th>Descripción</th><th>Monto</th><th>Método</th><th></th></tr>
          </thead>
          <tbody id="expense-tbody"></tbody>
        </table>
      </div>
    </section>
  </main>

  <script src="/socket.io/socket.io.js"></script>
  <script src="geo.js?v=4"></script>
  <script src="proveedores.js"></script>
  <script src="settings.js"></script>
  <script src="logout.js"></script>
</body>
</html>
